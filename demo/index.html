<!doctype html>
<html>
<head><meta charset="utf-8"><title>OEM Parts</title></head>
<body>
  <h1>Find parts</h1>
  <select id="brand"><option value="">Pick a brand</option></select>
  <select id="model"><option value="">Pick a model</option></select>
  <ul id="parts"></ul>

<script>
const API = 'http://localhost:3000';
const brand = document.getElementById('brand');
const model = document.getElementById('model');
const parts = document.getElementById('parts');

async function get(path) {
  const res = await fetch(API + path);
  return res.json();
}

function fill(select, rows, label) {
  select.replaceChildren(new Option(label, ''));
  for (const r of rows) select.add(new Option(r.name, r.id));
}

get('/brands').then((rows) => fill(brand, rows, 'Pick a brand'));

brand.onchange = async () => {
  parts.replaceChildren();
  if (!brand.value) return fill(model, [], 'Pick a model');
  fill(model, await get('/models?brand_id=' + brand.value), 'Pick a model');
};

model.onchange = async () => {
  parts.replaceChildren();
  if (!model.value) return;
  for (const p of await get('/parts?model_id=' + model.value)) {
    const li = document.createElement('li');
    li.textContent =
      `${p.oem_number} - ${p.name} - $${(p.price_cents / 100).toFixed(2)}` +
      (p.stock === 0 ? ' (out of stock)' : '');
    parts.append(li);
  }
};
</script>
</body>
</html>
